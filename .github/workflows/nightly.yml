name: Nightly

# The counterpart to ci.yml, which gates every push on a build and two tests.
# This is where the repository actually does what its name says: it installs
# Prosody and ejabberd and runs the federation and stream-management suites
# against them.
#
# Why that cannot be the gate: the setups fetch Debian packages at run time, so
# a red run can mean "the mirror was slow" as easily as "the federation broke".
# A merge must not hang on that. Read this workflow for the conformance
# verdict and ci.yml for whether it compiles.
#
# The interop lane is the main reason this workflow exists, and the reason it
# can exist at all is a detail of how the tests decide to skip: the ones marked
# "only inside WSL" gate on `OperatingSystem.IsLinux()`, not on WSL. On the
# Windows developer machine they skip because the Hyper-V firewall discards
# every connection from WSL to the host, so the far side cannot dial *in*. In
# this container there is no such border — the peers are native, on the same
# loopback as the server under test — so those tests run instead of skipping.
# Measured before this file was written: with Prosody alone, on Debian 13, all
# thirteen Prosody tests pass, including the four that skip on Windows.
#
# The OMEMO oracle is the third far side here, and it took the same step to get
# in. It used to be reached with `wsl -d Debian` and a Windows path rewritten to
# /mnt/c/… — a Windows-host assumption baked into the test rather than into the
# oracle — so on Linux `Process.Start("wsl")` threw before the probe could
# decide to skip and the three tests came out RED, saying "the oracle is not to
# be found" while the checkout was perfectly fine. They now gate on
# `OperatingSystem.IsLinux()` like everything else and start python3 directly,
# which is why this container installs python-omemo and runs them instead of
# excluding them by name.
#
# Two things worth knowing about scheduled workflows: they only ever run on the
# default branch, and GitHub disables them after 60 days without repository
# activity. If this stops reporting, that is the first thing to check.
on:
  schedule:
    # 03:41 UTC. Off the hour on purpose: GitHub's scheduler is busiest then
    # and delays runs by tens of minutes.
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # The suite against real far sides, at the revisions the gitlinks pin.
  # ---------------------------------------------------------------------------
  interop:
    name: interop (pinned submodules)
    runs-on: ubuntu-latest
    container: debian:13
    steps:

      # git must be installed BEFORE the checkout: without a git binary,
      # actions/checkout silently falls back to a REST tarball, which cannot
      # fetch submodules — and libs/Ratatoskr IS the system under test.
      - name: Install git and the .NET prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      # What the two setup scripts need beyond the packages they fetch
      # themselves. They deliberately install nothing: `apt-get download` plus
      # `dpkg-deb -x` unpacks Prosody and ejabberd into a prefix under $HOME, so
      # neither needs root and neither leaves anything behind — which is why
      # the same scripts serve the developer's WSL and this container without a
      # variant. openssl generates the test CA and the certificates, procps
      # provides the `pkill` they use to clear a previous run.
      #
      # `apt-get download` still needs the package lists, which the step above
      # has already fetched.
      # openssl generates the test CA and the certificates, procps provides the
      # `pkill` both scripts use to clear a previous run, and wget is how the
      # ejabberd setup fetches its forty-one Erlang packages — it asks apt for
      # the URIs (`--print-uris`) rather than maintaining the list, then
      # downloads them itself. None of the three is in the bare debian:13
      # image; ca-certificates, which wget needs for HTTPS, came with the step
      # above. No xz-utils: dpkg-deb decompresses the data member itself.
      #
      # python3 is the third far side's interpreter. Trixie ships 3.13.5, and
      # fetch_oracle.py asks PyPI for manylinux/cp313 wheels — the two have to
      # agree, or the native parts of the reference implementation do not
      # import.
      - name: Install what the far sides need
        run: apt-get install -y --no-install-recommends openssl procps python3 wget

      # `true` rather than `recursive`, and not interchangeable: XMPPConsole
      # pins its own Hermod, Styx and Ratatoskr, so recursing would put a second
      # revision of the library under test in this tree. The longer note stands
      # in ci.yml.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build XMPPConformanceTests/XMPPConformanceTests.csproj --configuration Release

      # Prosody 13.0.1 and ejabberd 24.12 out of trixie — the versions Debian
      # 13 ships, which is what the developer's WSL Debian installs too, so
      # this lane and that machine judge Ratatoskr by the same peers.
      #
      # Both scripts start their peer and then check that it came up; a failure
      # to launch exits non-zero here rather than turning into a wall of
      # skipped tests further down. That distinction is the whole point of the
      # skip counts below.
      - name: Set up Prosody
        run: bash tools/prosody/setup.sh

      - name: Set up ejabberd
        run: bash tools/ejabberd/setup.sh

      # The third far side, and the one this repository cannot do without on
      # principle: anything checked against ourselves agrees even where both
      # sides compute the same wrong thing, which in D62 to D65 was the finding
      # five times over.
      #
      # Two libraries, one script, one directory. python-omemo (Syndace) is the
      # reference implementation for `urn:xmpp:omemo:2`; slixmpp brings its own
      # `xep_0461`, which is the only way a message reply can be judged at all —
      # Prosody and ejabberd carry the `<reply/>` across without looking at it,
      # so the two server lanes above have nothing to say about that one.
      #
      # The script fetches wheels and unpacks them onto a directory — no pip,
      # no venv, nothing installed, nothing left behind — into exactly the path
      # both oracle fixtures put on the PYTHONPATH.
      #
      # No `continue-on-error`, for the same reason the two peer setups check
      # that their peer came up: a fetch that failed has to be a failed step
      # here and not three quietly skipped tests further down.
      - name: Set up the oracles
        run: python3 XMPPConformanceTests/XEPs/Oracle/fetch_oracle.py /tmp/omemo-oracle/lib

      # The two variables are what the tests read to find the test CA; without
      # them every far-side test skips with "points at no test CA", which is a
      # green run that measured nothing. They still say JABBER_ rather than
      # XMPP_: D99 left them alone on purpose, because they live in the
      # environment of whoever runs the tests and renaming them would silently
      # skip every check until each machine had been changed over.
      #
      # Unfiltered since the OMEMO lane came in. It used to exclude
      # OmemoOracleTests by name, because the oracle was reached through
      # `wsl -d Debian` and the three tests went red on any Linux; now they run
      # here like everything else, and the exclusion would be the one thing
      # keeping the reference implementation out of CI.
      #
      # Unfiltered rather than `TestCategory=WSL`, which is the counterpart of
      # the gate's `TestCategory!=WSL` and would run 135 of these 137. The two
      # left over are ThePatienceCoversWhatTheClientMayTake, which needs no far
      # side and costs nothing to run again here — and running the whole suite
      # in one step keeps the expected numbers below a single pair rather than
      # two that have to be added up.
      #
      # Expect 137 tests, 137 passed, 0 skipped, with every far side up: the
      # affix check, the five reply checks, twice thirty room and archive
      # checks, twice eleven upload checks, six against the XEP-0454 oracle and
      # twice four avatar checks.
      #
      # The 103 was measured on Debian 13 at b19331e, in both lanes: pinned
      # submodules and against Ratatoskr's master. The 71 before it was
      # measured at 6883eb4. The 137 was measured on Windows first and then
      # confirmed here at 23564c7, in both lanes: 137 of 137, nothing skipped.
      # The confirmation was started by hand rather than waited for, because a
      # figure that is named before it is evidence should stay that way for
      # hours and not for a day.
      #
      # The eighteen D119 adds were written and measured on Windows first, and
      # the platforms did disagree once on the way - Uri.TryCreate("/p",
      # UriKind.Absolute) fails on Windows and succeeds on Linux, where it means
      # file:///p. That went red here and was a fault in the code, not the test.
      # The revision is named because a count that says nothing about when it was
      # taken cannot be told apart from one that has gone stale, and this figure
      # has moved four times in four entries.
      #
      # It was 29 until the XEP-0454 fixture came in: four checks of OMEMO Media
      # Sharing against an encryptor written by pyca rather than by us, which
      # need no new package because the OMEMO oracle already brings
      # `cryptography` along. Then 33 until two checks went past the first
      # message of an OMEMO session - the second message in one session, and a
      # one-time prekey that must not serve twice. And 35 until three more asked
      # what happens when messages arrive in the wrong order, when both sides
      # open a session in the same moment, and when one carries nothing at all.
      # And 38 until one message went to four devices at once - the first check
      # of the fan-out, and the first of any kind for the list of devices a
      # message could not reach. And 39 until a message the reference really
      # encrypted, carrying an envelope that names somebody else, had to be
      # refused - the one check here that runs the other way round, because
      # python-omemo leaves the envelope to the application and has nothing to
      # refuse with.
      #
      # All five of those needed a new oracle mode and none of them needs
      # anything new installed - which is why this lane's package list has not
      # moved while its count has gone 29, 33, 35, 38.
      #
      # And 59 with XEP-0045, which is the first lane here whose far side is a
      # *component*: the rooms live on conference.prosody.test and
      # conference.ejabberd.test, domains beside their hosts, each with its own
      # name on the certificate. Its first run found something, too - Prosody
      # attaches the <stanza-id/> a reply in a room has to point at only when the
      # room archives, so archiving is switched on in both set-ups, with the
      # reason beside it.
      #
      # And 71 with XEP-0313, asked of the archives the room lane had already
      # switched on: what a room kept before somebody walked in, and what paging
      # backwards from the end of it gives. Both are questions one client alone
      # cannot ask - the conversation has to have happened before the asker was
      # there, and the archive has to belong to somebody else.
      #
      # Thirteen rounds per service, and the second service is the point: where one
      # counterpart and this client happen to agree, nothing tells agreement
      # from correctness. It has paid twice - once by agreeing about the lock
      # and the stanza-id, and once by disagreeing: ejabberd names the inviter
      # of a room by their real address, as the specification's example does,
      # and Prosody by their address in the room, which says who asked without
      # saying who that is. Both are usable; a client that assumes either one is
      # not.
      #
      # And 45 with XEP-0461, which was the first thing here to bring a second
      # library with it: slixmpp, through the same fetch_oracle.py into the same
      # directory. It has to, and that is the point of the fixture. A reply is
      # client-to-client - Prosody and ejabberd carry the <reply/> and the
      # <fallback/> across without looking at either - so this lane, the one
      # that finds things, could otherwise say nothing at all about it. What the
      # five check is the arithmetic beside the reference: the offsets of
      # XEP-0428 are counted in Unicode code points and .NET counts in UTF-16
      # units, and an implementation that confuses them is wrong only for text
      # nobody writes tests with.
      #
      # And 89 with XEP-0363, the first lane here whose interesting half is not
      # XMPP at all: the slot is asked for over the stream and the file goes
      # over HTTPS, so nothing short of a real service can answer it. Both
      # set-ups switch an upload module on - mod_http_file_share on Prosody,
      # mod_http_upload on ejabberd - and both serve the files on the port that
      # already carries the WebSocket.
      #
      # Two of the nine rounds go round the client on purpose and send the PUT
      # by hand, at an address that was never handed out and with a length the
      # slot was not issued for. They ask what decides whether an upload service
      # is a service or a drop box for the whole internet, and they are the only
      # rounds here that check a far side against itself rather than against us.
      #
      # And 93 with the sending half of XEP-0454, which is the only lane here
      # where a file passes through a foreign server that cannot read it. Two
      # of the four are the round against Prosody and ejabberd - the ciphertext
      # goes up under a random name, comes back without the key to show it is
      # not the plaintext, and comes back again with it. The other two are the
      # direction the oracle could not be asked before: until now every round
      # handed us what pyca wrote and asked whether we read it, which is the
      # easy half - an implementation can read everything the reference writes
      # and still write something the reference cannot read.
      #
      # And 99 with XEP-0084 over XEP-0163, which is the first lane here that
      # needs the two accounts to know each other - rooms, archives and uploads
      # all work between strangers. What it checks is not ours: that a server
      # pushes a PEP node to a contact whose caps ask for it, which is the
      # roster subscription, the caps and the delivery decision, all three the
      # server's own bookkeeping.
      #
      # Its first run found that neither far side had personal eventing switched
      # on at all - mod_pep on Prosody, mod_pubsub with the pep plugin and
      # mod_caps on ejabberd. Fourth time in this suite that a module was there
      # all along and had to be asked for.
      #
      # And 103 with OMEMO in a room (D125), which is two questions in one:
      # whether a service writes the real addresses into the occupant presences
      # when muc#roomconfig_whois says to - without which nothing in a room can
      # be encrypted at all - and whether it passes on a groupchat message that
      # has no <body/>. Nothing obliges it to: a service deciding an empty
      # message is nothing to deliver would break every encrypted room without
      # an error anywhere. Our own tests cannot ask that, because there the room
      # is played by the test and passes on whatever it is given.
      #
      # And 107 with the two rounds D129 added, both of them the same shape:
      # a state every earlier round had quietly arranged away. Who may invite -
      # ejabberd lets nobody but the owner, Prosody anybody in the room, and
      # every round until then had the owner do it. And a room that does not
      # archive - both set-ups switch archiving on for every room they make,
      # so the state a room is in when nobody arranged anything had never been
      # entered. The two services disagree there too, which is why what is
      # checked is the client's rule rather than the service's choice.
      #
      # And 113 with the rest of the owner protocol (D130): taking a room down
      # and reading back who is on its lists. The first is not arrangeable from
      # one side at all - a destruction exists only as something a service does
      # to everybody present, and the half that matters is the one this client
      # did not send. The second is the only way to know an affiliation took: a
      # result says the service accepted the request and nothing about who
      # ended up on any list, and until now the suite read affiliations back
      # out of the presence a room sends, which works only while the person is
      # standing in it.
      #
      # And 117 with the third account (D131). Both setup.sh scripts register
      # carol now, and she is a stranger on purpose: alice and bob subscribe to
      # each other for the avatar lane, and a roster on a real server outlives
      # everything, so no question about what a non-contact may see could be
      # asked at all until there was somebody nobody had ever asked for
      # anything. What she buys: one publish watched by a contact and a
      # stranger at once, a member inviting a real outsider instead of somebody
      # already in the room, and a members-only room where one person on the
      # list gets in and one not on it does not.
      #
      # And 121 with the two questions she left open (D132). A room archive is
      # not guarded by having been there - XEP-0313 puts the test at the right
      # to ENTER at the time of the query, so an open room is readable by
      # anybody who is not an outcast. Both services get that right, and both
      # shut the same archive to the same asker the moment she is banned, which
      # is the half no single query can show. And an uploaded file is guarded
      # by its address and nothing else - the specification says so outright,
      # and it is the whole argument for XEP-0454. Beside it, pinned rather
      # than required because XEP-0363 is silent: neither service lets a slot
      # be filled twice.
      #
      # And 127 with what XEP-0045 had left (D133): a password-protected room,
      # asked from both sides of the door; a voice request, which travels as an
      # ordinary message with no body and no status code so that nothing shows
      # it; and a nickname held in a room, which is XEP-0077 pointed at a room
      # and was being looked for under the wrong namespace all along. The
      # services differ twice here: ejabberd names the nickname it holds and
      # Prosody does not, and ejabberd's default room makes a joiner a
      # participant where Prosody's makes them a visitor - so the voice round
      # sets the role by hand rather than measure somebody's default.
      #
      # And 131 with the private message in a room (D134), which needs three
      # occupants and could not have been written before there was a third
      # account: privacy is a statement about who did NOT get something, and
      # with two accounts there is nobody left over to be that person. Asked
      # twice, because delivery is not the only way out - the second round asks
      # whether the service wrote it into the room's archive, which D132 showed
      # is open to anybody who may enter.
      #
      # And 133 with XEP-0308 in a room (D135), which had never been possible:
      # nothing said in a room was written down as correctable, and the
      # correction would have gone out as a chat anyway. The round is asked from
      # the OTHER occupant, because the specification does not say which id a
      # correction in a room points at and the sender cannot see the answer: the
      # id Bob saw on the first line has to be the id the correction names.
      # Both services reflect the sender's id unchanged, which is what makes
      # corrections in their rooms work at all.
      #
      # And 137 with XEP-0424 (D136), asked twice because delivery is not
      # storage. The second round is the one with teeth: the archiving service
      # MUST store the retraction message, and what becomes of the message it
      # retracts is the service's own choice - so the obligation is asserted and
      # the choice reported. The two differ: ejabberd drops the retracted line
      # from the room archive, Prosody keeps it. Both are within the XEP, and
      # with D132 in mind the second means a retracted line is still handed to
      # everybody who reads the archive later.
      #
      # A skip here is a finding: it means a peer did not come up or an oracle
      # did not import, and the reason will be in the TRX.
      #
      # The two variables are exported in the shell rather than declared under
      # `env:`, because they have to contain $HOME and a step-level `env:`
      # value is not passed through a shell — `$HOME/prosody-test/certs` would
      # arrive at the test as those literal eleven characters plus a path, and
      # every far-side test would skip with "points at no test CA". A green run
      # that measured nothing, in other words, which is the one failure mode
      # this repository has been caught by twice.
      - name: Test (federation, stream management and OMEMO against real far sides)
        timeout-minutes: 45
        run: |
          export JABBER_PROSODY_CERTS="$HOME/prosody-test/certs"
          export JABBER_EJABBERD_CERTS="$HOME/ejabberd-test/certs"
          dotnet test XMPPConformanceTests/XMPPConformanceTests.csproj --configuration Release --no-build \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFilePrefix=interop" \
            --results-directory artifacts

      # When a federation test goes red the peer's own log is usually the
      # shorter way to the reason than the stanza trace on our side — Prosody
      # says plainly when it rejected a certificate or refused a dialback.
      - name: Collect the peer logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts/peer-logs
          cp "$HOME/prosody-test/prosody.log"   artifacts/peer-logs/ 2>/dev/null || true
          cp "$HOME/prosody-test/prosody.out"   artifacts/peer-logs/ 2>/dev/null || true
          cp "$HOME/ejabberd-test"/logs/*.log   artifacts/peer-logs/ 2>/dev/null || true

      # TRX preserves the skip reasons, which in this repository is most of
      # what a run says when something did not come up — and the evidence when
      # a lane goes red.
      #
      # !cancelled() rather than success(): a red run is when these files
      # matter most, and uploading only on green would throw away the evidence
      # in exactly that case.
      - name: Upload test results and peer logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-interop
          path: artifacts/**

  # ---------------------------------------------------------------------------
  # The referee job: the same lane, against Ratatoskr's current master.
  # ---------------------------------------------------------------------------
  against-ratatoskr-master:
    # The job above tests the revisions the gitlinks pin, which is the right
    # question for "would a fresh clone still federate". It is the wrong
    # question for what this repository is — a suite that can be pointed at any
    # Ratatoskr revision. Nothing in the gate notices when Ratatoskr moves,
    # because a push over there does not touch this repository at all, and the
    # pins do drift: at the time of writing libs/Hermod was pinned 59 commits
    # behind the master it is built against on the developer's machine.
    #
    # Same lane, one variable changed. Red here and green above means
    # Ratatoskr (or Hermod or Styx underneath it) changed in a way a real far
    # side can see — which is a finding, not a build failure, and that is why
    # it is a separate job rather than a second step.
    name: interop (submodules at master)
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install git and the .NET prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      # openssl generates the test CA and the certificates, procps provides the
      # `pkill` both scripts use to clear a previous run, and wget is how the
      # ejabberd setup fetches its forty-one Erlang packages — it asks apt for
      # the URIs (`--print-uris`) rather than maintaining the list, then
      # downloads them itself. None of the three is in the bare debian:13
      # image; ca-certificates, which wget needs for HTTPS, came with the step
      # above. No xz-utils: dpkg-deb decompresses the data member itself.
      # python3 is the OMEMO oracle's interpreter; the longer note stands in
      # the job above.
      - name: Install what the far sides need
        run: apt-get install -y --no-install-recommends openssl procps python3 wget

      # `true` rather than `recursive`, and not interchangeable: XMPPConsole
      # pins its own Hermod, Styx and Ratatoskr, so recursing would put a second
      # revision of the library under test in this tree. The longer note stands
      # in ci.yml.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # safe.directory because the checkout is owned by a different uid than
      # the one this container runs as, and git refuses to operate otherwise.
      - name: Move the submodules to master
        run: |
          git config --global --add safe.directory '*'
          git submodule foreach 'git fetch origin master && git checkout FETCH_HEAD'
          echo "### Submodule revisions under test" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git submodule status >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build XMPPConformanceTests/XMPPConformanceTests.csproj --configuration Release

      - name: Set up Prosody
        run: bash tools/prosody/setup.sh

      - name: Set up ejabberd
        run: bash tools/ejabberd/setup.sh

      # The same third far side as above, and it belongs here for the reason
      # this job exists at all: OMEMO is Ratatoskr's own code, so the question
      # "did master break what a foreign implementation can read" is exactly
      # the one this lane is meant to answer. Left out, the three would skip
      # here and pass there, and the referee would be silent about the one
      # thing it is closest to.
      - name: Set up the oracles
        run: python3 XMPPConformanceTests/XEPs/Oracle/fetch_oracle.py /tmp/omemo-oracle/lib

      - name: Test (against Ratatoskr master)
        timeout-minutes: 45
        run: |
          export JABBER_PROSODY_CERTS="$HOME/prosody-test/certs"
          export JABBER_EJABBERD_CERTS="$HOME/ejabberd-test/certs"
          dotnet test XMPPConformanceTests/XMPPConformanceTests.csproj --configuration Release --no-build \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFilePrefix=interop-master" \
            --results-directory artifacts

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-interop-master
          path: artifacts/*.trx
  upstream-far-sides:
    # The two jobs above both ask about *our* code: one against the pins, one
    # against Ratatoskr's master. Neither can ask the other question, because
    # both hold the far sides still - Prosody 13.0.1 and ejabberd 24.12, the
    # versions Debian 13 ships. That is deliberate and stays: the developer's
    # WSL installs the same two, so those lanes and that machine judge
    # Ratatoskr by the same peers.
    #
    # It does mean the suite cannot see a peer change. Upstream is well past
    # Debian - 13.0.6 and 26.07 at the time of writing, which for ejabberd is
    # more than a year and five releases - and this repository records a good
    # deal of *measured* behaviour: that ejabberd drops a retracted line from a
    # room's archive and Prosody keeps it (D136), that ejabberd's default room
    # refuses an invitation from anybody but the owner and Prosody's does not
    # (D129), that ejabberd names a held nickname where Prosody answers
    # `<registered/>` without one (D133). Every one of those is a statement
    # about a version, and none of them can go stale loudly: nothing turns red
    # when a peer changes its mind, because nothing here ever asks a newer one.
    #
    # This job asks. It is **informational** — `continue-on-error`, like the
    # tips lane in XMPPWebApp's nightly — and the distinction matters as much
    # as it does there: a red here does not mean Ratatoskr broke. It means one
    # of three things, and reading the log is the only way to tell them apart:
    # a peer changed a behaviour this repository has written down, a peer
    # changed something that is genuinely our bug to fix, or ProcessOne moved
    # a download URL. Only the second is work on this side, and it must not be
    # able to redden a nightly that is otherwise telling the truth.
    #
    # The oracle comes with `--latest` here for the same reason the peers do:
    # its pins (D138) keep the two jobs above reproducible, and this is the
    # lane whose whole job is to find out what moving them would cost.
    name: interop (far sides at upstream)
    runs-on: ubuntu-latest
    container: debian:13
    continue-on-error: true
    steps:
      - name: Install git and the .NET prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      - name: Install what the far sides need
        run: apt-get install -y --no-install-recommends openssl procps python3 wget

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build XMPPConformanceTests/XMPPConformanceTests.csproj --configuration Release

      # One variable each, and the scripts do the rest. Prosody's upstream
      # build is made for Debian and unpacks into the same paths, so only the
      # one package changes; ejabberd's is a self-contained bundle under /opt
      # with its own Erlang, so that setup forks further - see the scripts.
      - name: Set up Prosody (upstream)
        env:
          JABBER_PROSODY_UPSTREAM: "1"
        run: bash tools/prosody/setup.sh

      - name: Set up ejabberd (upstream)
        env:
          JABBER_EJABBERD_UPSTREAM: "1"
        run: bash tools/ejabberd/setup.sh

      - name: Set up the oracles (newest, not pinned)
        run: python3 XMPPConformanceTests/XEPs/Oracle/fetch_oracle.py /tmp/omemo-oracle/lib --latest

      - name: Test (against the newest far sides)
        timeout-minutes: 45
        run: |
          export JABBER_PROSODY_CERTS="$HOME/prosody-test/certs"
          export JABBER_EJABBERD_CERTS="$HOME/ejabberd-test/certs"
          dotnet test XMPPConformanceTests/XMPPConformanceTests.csproj --configuration Release --no-build \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFilePrefix=interop-upstream" \
            --results-directory artifacts

      # The peer logs matter more here than anywhere else: when this lane goes
      # red the question is always "which of the three was it", and the answer
      # is usually in what the peer said rather than in what the test said.
      - name: Collect the peer logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts/peer-logs
          cp "$HOME/prosody-test/prosody.log"   artifacts/peer-logs/ 2>/dev/null || true
          cp "$HOME/prosody-test/prosody.out"   artifacts/peer-logs/ 2>/dev/null || true
          cp "$HOME/ejabberd-test/logs/"*.log   artifacts/peer-logs/ 2>/dev/null || true

      - name: Upload test results and peer logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-interop-upstream
          path: |
            artifacts/*.trx
            artifacts/peer-logs/**
